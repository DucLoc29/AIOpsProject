frr version 8.4_git
frr defaults traditional
hostname core-router
log stdout
no ipv6 forwarding
!
! ===== Core Router (Edge) - OSPF Router-ID 2.2.2.2 =====
! eth1 : 10.0.1.1/30      -> Firewall (outside)
! eth2 : 10.0.12.2/30     -> Branch Router (WAN1 - Primary, cost 10)
! eth3 : 10.0.13.2/30     -> Branch Router (WAN2 - Backup,  cost 50)
! eth4 : 203.0.113.1/24   -> Internet (internet-attacker)
!
! Mang LAN noi bo nam sau Firewall
ip route 192.168.10.0/24 10.0.1.2
!
interface eth1
 description To-Firewall-Outside
 ip address 10.0.1.1/30
exit
!
interface eth2
 description WAN1-Primary-To-Branch
 ip address 10.0.12.2/30
 ip ospf network point-to-point
 ip ospf cost 10
exit
!
interface eth3
 description WAN2-Backup-To-Branch
 ip address 10.0.13.2/30
 ip ospf network point-to-point
 ip ospf cost 50
exit
!
interface eth4
 description To-Internet
 ip address 203.0.113.1/24
exit
!
router ospf
 ospf router-id 2.2.2.2
 redistribute static
 passive-interface eth1
 passive-interface eth4
 network 10.0.1.0/30 area 0
 network 10.0.12.0/30 area 0
 network 10.0.13.0/30 area 0
 network 203.0.113.0/24 area 0
exit
!
