frr version 8.4_git
frr defaults traditional
hostname branch-router
log stdout
no ipv6 forwarding
!
! ===== Branch Router - OSPF Router-ID 1.1.1.1 =====
! eth1 : 172.16.1.1/24   -> Branch LAN (branch-client)
! eth2 : 10.0.12.1/30    -> Core Router (WAN1 - Primary, cost 10)
! eth3 : 10.0.13.1/30    -> Core Router (WAN2 - Backup,  cost 50)
!
interface eth1
 description Branch-LAN
 ip address 172.16.1.1/24
exit
!
interface eth2
 description WAN1-Primary-To-Core
 ip address 10.0.12.1/30
 ip ospf network point-to-point
 ip ospf cost 10
exit
!
interface eth3
 description WAN2-Backup-To-Core
 ip address 10.0.13.1/30
 ip ospf network point-to-point
 ip ospf cost 50
exit
!
router ospf
 ospf router-id 1.1.1.1
 passive-interface eth1
 network 10.0.12.0/30 area 0
 network 10.0.13.0/30 area 0
 network 172.16.1.0/24 area 0
exit
!
