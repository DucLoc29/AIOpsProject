# Nginx vhost cho service-server (mount vào /etc/nginx/conf.d/default.conf)
server {
    listen 80 default_server;
    server_name portal.corp.local _;

    root  /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Tầng ứng dụng: reverse proxy tới Flask API (app-server)
    location /api/ {
        proxy_pass http://192.168.10.20:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # Metrics ứng dụng: chỉ cho localhost và mạng OOB (exporter/Prometheus)
    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 172.20.20.0/24;
        deny  all;
    }
}
